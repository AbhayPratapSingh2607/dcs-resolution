# Air defense profiles for the fast-forward combat model.
#
# Keyed by the DCS id of the unit that *fires* (launcher, TELAR or gun). Units
# without an entry are derived from their unit class and pydcs threat range.
#
#   guidance:   radar (needs a live tracking radar in the group) | telar (radar
#               on the launcher itself) | ir (optical/IR, no emitter) | gun
#   min_alt_m / max_alt_m: engagement altitude envelope.
#   pk:         per-missile (or per-burst for guns) kill probability against a
#               non-manoeuvring target inside the envelope.
#   channels:   simultaneous targets the site can guide missiles onto.
#   salvo:      missiles fired per target per engagement.
#   missiles:   ready rounds per launcher.
#   reaction_s: time from cue to first launch.
#   eccm:       resistance to jamming, 0..1.
#   emcon:      chance the site shuts its radar down when it detects an ARM
#               launch (Skynet's harm_detection_chance is used when present).
#   mast_m:     antenna height used for the radar horizon.
#   reliability: share of missiles that work as designed. Old systems were
#               notoriously unreliable (SA-2 ~0.6), modern ones ~0.9.

