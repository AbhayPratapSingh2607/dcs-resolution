# Combat profiles for the fast-forward combat model.
#
# Keyed by DCS unit type id. Any aircraft without an entry gets a profile
# derived from its year of introduction, role and pydcs data, so this file only
# needs entries where the derived values would be noticeably wrong.
#
# Fields (all optional):
#   radar_km:  detection range of the onboard radar against a 5 m^2 target.
#   radar:     none | pulse | pd (pulse-doppler, look-down capable) | aesa
#   rcs:       frontal radar cross section, m^2 (clean-ish).
#   irst:      has an infrared search and track sensor.
#   hmcs:      helmet cueing for high off-boresight IR missiles.
#   ecm:       self-protection jamming effectiveness, 0..0.5.
#   rwr:       quality of radar warning, 0..1.
#   maws:      has a missile approach warning system.
#   agility:   close-in fight performance relative to a 4th gen fighter (1.0).
#   datalink:  shares tracks with the package/AWACS.
#   awacs_km:  surveillance radar range against a 5 m^2 target (AWACS only).
#   towed_decoy: carries a towed radar decoy (ALE-50/55).

