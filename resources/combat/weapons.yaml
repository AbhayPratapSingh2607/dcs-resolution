# Air-to-air missile profiles for the fast-forward combat model.
#
# Keyed by weapon group name (resources/weapons/**). A "-2X"/"-4X" suffix on a
# group name is stripped before lookup and used as the count per pylon.
# Air-to-ground weapons are classified from their names (see
# game/sim/combat/model/profiles.py); add an entry here to override that.
#
#   guidance:  arh (active radar) | sarh (semi-active radar) | ir | beam
#   range_km:  maximum kinematic range, head-on at medium altitude.
#   nez_km:    no-escape zone against a manoeuvring target.
#   pk:        probability of kill against a target that does not react, inside
#              the NEZ, before countermeasures, skill and ECM are applied.
#   all_aspect: IR missile can lock from the front hemisphere.
#   hobs:      high off-boresight seeker (big advantage in close-in fights).
#   year:      for informational purposes.
#
# Historic combat Pk is far lower than these numbers because most real shots
# were taken outside the NEZ, at defending targets, by stressed pilots. The
# model applies those penalties itself.

