# Ground combat profiles for the fast-forward front-line model.
#
# "classes" gives defaults per Retribution unit class. "units" overrides by
# DCS unit id. The final values are scaled by a technology factor derived from
# the unit's year of introduction unless the unit has an explicit entry.
#
#   anti_armor: killing power against armoured vehicles per engagement round.
#   anti_soft:  killing power against soft and lightly armoured targets.
#   protection: how hard the unit is to kill (tank = 1.0).
#   indirect:   fires from behind the line (artillery); immune to direct fire
#               and only attrited by counter-battery fire and air attack.
#   thermal:    has thermal sights (night fighting).
#   air_defense: contribution against attack helicopters / low CAS.

classes:
  Tank:         {anti_armor: 1.0,  anti_soft: 0.7,  protection: 1.0}
  IFV:          {anti_armor: 0.45, anti_soft: 0.8,  protection: 0.45}
  APC:          {anti_armor: 0.08, anti_soft: 0.45, protection: 0.3}
  ATGM:         {anti_armor: 0.9,  anti_soft: 0.15, protection: 0.2}
  Artillery:    {anti_armor: 0.25, anti_soft: 1.0,  protection: 0.2, indirect: true}
  Recon:        {anti_armor: 0.15, anti_soft: 0.35, protection: 0.3}
  SHORAD:       {anti_armor: 0.02, anti_soft: 0.2,  protection: 0.3, air_defense: 1.0}
  AAA:          {anti_armor: 0.05, anti_soft: 0.6,  protection: 0.25, air_defense: 0.6}
  Manpad:       {anti_armor: 0.0,  anti_soft: 0.05, protection: 0.1, air_defense: 0.5}
  Logistics:    {anti_armor: 0.0,  anti_soft: 0.0,  protection: 0.05}
  Infantry:     {anti_armor: 0.2,  anti_soft: 0.5,  protection: 0.15}
  Unknown:      {anti_armor: 0.1,  anti_soft: 0.3,  protection: 0.3}

