# Fuel and air-to-air refueling for the fast-forward combat model.
#
# A flight's fuel margin (0..1) is how much fuel it has left for fighting,
# loitering and re-attacking once it reaches its target. It comes from the
# distance between the flight's base and its target, compared with the
# aircraft's combat radius. A friendly tanker in reach tops it up, but only
# for aircraft that can refuel in the air, from a tanker of their own system
# (boom or drogue, below).
#
# Combat radius is derived from internal fuel (250 km + 0.08 km per kg of
# fuel_max, which gives an F-16 about 510 km and a Su-27 about 1000 km).
# Helicopters get 150 km and heavies 2000 km. Override it here where the
# estimate is noticeably wrong.

radius_km:
  A-10A: 460
  A-10C: 460
  A-10C_2: 460
  AV8BNA: 300
  F-15E: 1100
  F-15ESE: 1100
  F-14A-135-GR: 900
  F-14B: 900
  FA-18C_hornet: 550
  Su-24M: 600
  Su-25: 375
  Su-25T: 375
  MiG-21Bis: 350
  MiG-29A: 450
  MiG-29S: 500
  Tornado GR4: 750
  Tornado IDS: 750
  F-117A: 900
  B-1B: 3000
  B-52H: 3500
  Tu-95MS: 3500
  Tu-160: 3500
  Tu-22M3: 2000

# Air-to-air refueling systems. A tanker refuels only aircraft of its own
# system: a flying boom (mostly USAF) or probe-and-drogue (US Navy and Marines,
# and most other air forces). The planner puts boom tankers where the boom
# receivers fly and drogue tankers where the probe aircraft fly, near the
# carriers for carrier air wings.
#
# Tankers listed here use a boom; every other tanker trails drogues (KC-135
# MPRS, KC-10 Drogue, KC-130, S-3B, IL-78M, F/A-18E/F and A-6E tankers).
boom_tankers:
  - KC-135
  - KC_10_Extender
# Aircraft with a boom receptacle; every other aircraft that can refuel has a
# probe. The F-105 and RF-101 had both: they are listed here.
