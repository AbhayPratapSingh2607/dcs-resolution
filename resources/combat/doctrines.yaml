# Combat doctrines: how a side fights, as opposed to how well (force_quality.yaml).
#
# Doctrines are selected per faction: the force quality tier picks a default
# doctrine here, and WWII-era factions (faction doctrine "ww2") always use the
# "ww2" doctrine.
#
# Intelligence
#   isr:               quality of the side's intelligence, surveillance and
#                      reconnaissance (pre-war picture, BDA accuracy, recon).
#   prewar_mobile:     share of the enemy's mobile units (mobile SAMs, SHORAD,
#                      vehicle groups) known at the start of the war.
# Air
#   strike_altitude:   medium (above MANPADS/AAA, relies on SEAD) or low
#                      (terrain masking against radar SAMs, exposed to guns).
#   a2a_salvo:         missiles fired per target per pass (Soviet doctrine paired
#                      a radar and an IR missile).
#   abort_threshold:   multiplier on the chance that engaged strikers abort.
#   cap_over_hvaa:     protect AWACS and tankers with dedicated CAP.
# Air defense
#   sam_ambush:        sites keep radars dark until targets are close.
#   shoot_and_scoot:   mobile sites relocate after firing.
#   gps_jamming:       GPS jamming over own territory.
#   decoy_discrimination: ability to tell decoys from aircraft (0..1).
# Planning
#   iads_rollback_first: suppress and destroy the IADS before deep strikes.
#   decapitation:      target IADS command, comms and power nodes.
#   require_sead_escort: don't send strikers into known radar SAM coverage
#                      without SEAD or jammer support.
#   ground_support_priority: favour CAS/BAI over strategic targets.
#   planning_profile:  air campaign planning profile in resources/doctrine/planning
#                      used by the JFACC planner; doctrines without one use the
#                      legacy HTN planner.
# Ground
#   combined_arms:     how much the force benefits from a balanced mix.
#   artillery_prep:    multiplier on artillery in the first round of an attack.
#   maneuver:          flanking/manoeuvre bonus when attacking with superiority.
#   depth:             defense in depth (breaks later when reserves exist).
#   morale_baseline:   resting morale of squadrons and ground forces.
# Strategic intelligence
#   sat_optical_passes / sat_sar_passes: imaging satellite passes per turn.
#                      Optical needs daylight and clear skies; SAR (radar)
#                      sees through weather and at night but identifies less.
#   sat_quality:       resolution and analysis of the imagery.
#   humint / sigint:   agency human and signals intelligence.
#   counterintel:      ability to deny the enemy's agencies.
#   deception:         camouflage and decoy discipline (maskirovka).
#   roe_restrictive:   strict rules of engagement near civilians.
#   collateral_sensitivity: how much civilian casualties cost national resolve.

