# Air wing preset. See docs/resolution/Air-Wing-Presets.md for the format.
# Source: mid-2000s carrier air wing (US Navy CVW organisation, e.g. CVW-8 on
# USS Theodore Roosevelt 2005-06, the last F-14 cruise): VF (F-14D), 3 VFA (F/A-18C/E),
# VAQ (EA-6B, 4), VAW (E-2C, 4), HS (SH-60F). Tanking by F/A-18E and S-3B.
# Differences: F-14B stands in for the F-14D.
name: US Navy Carrier Air Wing (2005)
description: >-
  Air wing in the last years of the Tomcat: one F-14B squadron, F/A-18C Hornets,
  an F/A-18E Super Hornet squadron (F/A-18C if not installed), EA-6B Prowlers,
  E-2C Hawkeyes, S-3B tankers and SH-60B Seahawks.
era: 2005
side: blue
groups:
  - base: carrier
    squadrons:
      - {aircraft: ["F-14B Tomcat", "F-14B(U) Tomcat"], country: USA, primary: BARCAP, secondary: air-to-air, size: 10}
      - {aircraft: ["F/A-18C Hornet (Lot 20)"], country: USA, primary: Strike, secondary: any, size: 12}
      - {aircraft: ["F/A-18C Hornet (Lot 20)"], country: USA, primary: SEAD, secondary: any, size: 12}
      - {aircraft: ["F/A-18E Super Hornet", "F/A-18C Hornet (Lot 20)"], country: USA, primary: TARCAP, secondary: any, size: 12}
      - {aircraft: ["EA-6B Prowler"], country: USA, primary: SEAD Escort, secondary: [SEAD, DEAD], size: 4}
      - {aircraft: ["E-2C Hawkeye"], country: USA, primary: AEW&C, size: 4}
      - {aircraft: ["S-3B Tanker"], country: USA, primary: Refueling, size: 4}
      - {aircraft: ["SH-60B Seahawk"], country: USA, primary: CSAR, secondary: [Transport], size: 4}
