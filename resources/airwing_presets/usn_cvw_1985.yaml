# Air wing preset. See docs/resolution/Air-Wing-Presets.md for the format.
# Source: mid-1980s carrier air wing (US Navy CVW organisation): 2 VF (F-14A, 12),
# 2 VA (A-7E, 12; F/A-18A in some wings from 1983), VA (A-6E, 10, with KA-6D),
# VAQ (EA-6B, 4), VAW (E-2C, 4), VS (S-3A, 10), HS (SH-3H, 6).
# Differences: S-3B (1987) stands in for the S-3A tanker; SH-60B (a frigate
# helicopter) for the SH-3H.
name: US Navy Carrier Air Wing (1985)
description: >-
  Mid-80s air wing: two F-14A squadrons, two A-7E squadrons, A-6E Intruders, EA-6B
  Prowlers, E-2C Hawkeyes, S-3B tankers and SH-60B Seahawks.
era: 1985
side: blue
groups:
  - base: carrier
    squadrons:
      - {aircraft: ["F-14A Tomcat (Block 135-GR Late)", "F-14A Tomcat (Block 135-GR Early)"], country: USA, primary: BARCAP, secondary: air-to-air, size: 12}
      - {aircraft: ["F-14A Tomcat (Block 135-GR Late)", "F-14A Tomcat (Block 135-GR Early)"], country: USA, primary: TARCAP, secondary: air-to-air, size: 12}
      - {aircraft: ["A-7E Corsair II"], country: USA, primary: Strike, secondary: air-to-ground, size: 12}
      - {aircraft: ["A-7E Corsair II"], country: USA, primary: BAI, secondary: air-to-ground, size: 12}
      - {aircraft: ["A-6E Intruder"], country: USA, primary: Strike, secondary: air-to-ground, size: 10}
      - {aircraft: ["EA-6B Prowler"], country: USA, primary: SEAD, secondary: [SEAD Escort, DEAD], size: 4}
      - {aircraft: ["E-2C Hawkeye"], country: USA, primary: AEW&C, size: 4}
      - {aircraft: ["S-3B Tanker"], country: USA, primary: Refueling, size: 4}
      - {aircraft: ["SH-60B Seahawk"], country: USA, primary: CSAR, secondary: [Transport], size: 4}
