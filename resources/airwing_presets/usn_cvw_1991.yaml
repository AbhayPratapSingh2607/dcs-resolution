# Air wing preset. See docs/resolution/Air-Wing-Presets.md for the format.
# Source: Desert Storm carrier air wings (Gulf War Air Power Survey, Vol. V, order
# of battle; e.g. CVW-17 on USS Saratoga): 2 VF (F-14A/B), 2 VFA (F/A-18C),
# VA (A-6E with KA-6D), VAQ (EA-6B, 4), VAW (E-2C, 4), VS (S-3B), HS (SH-3H).
# Differences: no KA-6D in DCS; S-3B tankers only.
name: US Navy Carrier Air Wing (1991)
description: >-
  Desert Storm era air wing: F-14 Tomcats, F/A-18C Hornets, A-6E Intruders, EA-6B
  Prowlers, E-2C Hawkeyes and S-3B tankers.
era: 1991
side: blue
groups:
  - base: carrier
    squadrons:
      - {aircraft: ["F-14B Tomcat", "F-14A Tomcat (Block 135-GR Late)"], country: USA, primary: BARCAP, secondary: air-to-air, size: 12}
      - {aircraft: ["F-14A Tomcat (Block 135-GR Late)", "F-14B Tomcat"], country: USA, primary: Escort, secondary: air-to-air, size: 12}
      - {aircraft: ["F/A-18C Hornet (Lot 20)"], country: USA, primary: Strike, secondary: any, size: 12}
      - {aircraft: ["F/A-18C Hornet (Lot 20)"], country: USA, primary: SEAD, secondary: any, size: 12}
      - {aircraft: ["A-6E Intruder"], country: USA, primary: Strike, secondary: air-to-ground, size: 10}
      - {aircraft: ["EA-6B Prowler"], country: USA, primary: SEAD Escort, secondary: [SEAD, DEAD], size: 4}
      - {aircraft: ["E-2C Hawkeye"], country: USA, primary: AEW&C, size: 4}
      - {aircraft: ["S-3B Tanker"], country: USA, primary: Refueling, size: 4}
