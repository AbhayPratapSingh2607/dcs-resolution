# Air wing preset. See docs/resolution/Air-Wing-Presets.md for the format.
# Source: the standard mid-1970s carrier air wing (US Navy CVW organisation, e.g.
# CVW-14 on USS Enterprise 1975): 2 VF (F-14A, 12 each), 2 VA (A-7E, 12 each),
# 1 VA (A-6E with KA-6D tankers), VAQ (EA-6B, 4), VAW (E-2, 4), VS (S-3A), HS (SH-3).
# Differences: no KA-6D or S-3A in DCS, so no tanker; no ASW or recon squadrons.
name: US Navy Carrier Air Wing (1975)
description: >-
  Post-Vietnam Nimitz-class air wing: two F-14A fighter squadrons, two A-7E light
  attack squadrons, an A-6E medium attack squadron, EA-6B jammers and E-2C Hawkeyes.
era: 1975
side: blue
groups:
  - base: carrier
    squadrons:
      - {aircraft: ["F-14A Tomcat (Block 135-GR Early)", "F-14A Tomcat (AI)"], country: USA, primary: BARCAP, secondary: air-to-air, size: 12}
      - {aircraft: ["F-14A Tomcat (Block 135-GR Early)", "F-14A Tomcat (AI)"], country: USA, primary: Escort, secondary: air-to-air, size: 12}
      - {aircraft: ["A-7E Corsair II"], country: USA, primary: Strike, secondary: air-to-ground, size: 12}
      - {aircraft: ["A-7E Corsair II"], country: USA, primary: CAS, secondary: air-to-ground, size: 12}
      - {aircraft: ["A-6E Intruder", "A-6A Intruder"], country: USA, primary: Strike, secondary: air-to-ground, size: 10}
      - {aircraft: ["EA-6B Prowler"], country: USA, primary: SEAD, secondary: [SEAD Escort, DEAD], size: 4}
      - {aircraft: ["E-2C Hawkeye"], country: USA, primary: AEW&C, size: 4}
