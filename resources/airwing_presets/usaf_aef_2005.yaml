# Air wing preset. See docs/resolution/Air-Wing-Presets.md for the format.
name: USAF Air Expeditionary Force (2005)
description: >-
  2000s USAF deployment: A-10C and F-16CM Wild Weasels at the front, F-15C, F-15E
  and more F-16s behind them, E-3 and KC-135 support at rear bases.
era: 2005
side: blue
groups:
  - base: airfield
    placement: front
    squadrons:
      - {aircraft: ["A-10C Thunderbolt II (Suite 3)", "A-10C Thunderbolt II (Suite 7)", "A-10A Thunderbolt II"], country: USA, primary: CAS, secondary: [BAI, Armed Recon], size: 12}
      - {aircraft: ["F-16CM Fighting Falcon (Block 50)"], country: USA, primary: SEAD, secondary: any, size: 12}
  - base: airfield
    placement: any
    squadrons:
      - {aircraft: ["F-15C Eagle"], country: USA, primary: BARCAP, secondary: air-to-air, size: 12}
      - {aircraft: ["F-15E Strike Eagle (Suite 4+)", "F-15E Strike Eagle"], country: USA, primary: Strike, secondary: any, size: 12}
      - {aircraft: ["F-16CM Fighting Falcon (Block 50)"], country: USA, primary: BAI, secondary: any, size: 12}
  - base: airfield
    placement: rear
    squadrons:
      - {aircraft: ["E-3A"], country: USA, primary: AEW&C, size: 2}
      - {aircraft: ["KC-135 Stratotanker"], country: USA, primary: Refueling, size: 4}
      - {aircraft: ["KC-135 Stratotanker MPRS", "KC-10 Extender (Drogue)"], country: USA, primary: Refueling, size: 2}
