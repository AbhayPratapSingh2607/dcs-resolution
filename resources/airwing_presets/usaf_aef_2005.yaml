# Air wing preset. See docs/resolution/Air-Wing-Presets.md for the format.
# Source: USAF deployments of the 2000s (Operation Iraqi Freedom order of battle,
# 2003): A-10A, F-16CJ (Block 50) SEAD, F-15C, F-15E, F-16C, E-3, KC-135/KC-10,
# and B-1B and B-52H from Diego Garcia, Fairford and Al Udeid.
# Differences: A-10C (2007) offered first, with the A-10A as fallback; KC-130J
# (or C-130) for the HC-130P Rescue King.
name: USAF Air Expeditionary Force (2005)
description: >-
  2000s USAF deployment: A-10C and F-16CM Wild Weasels at the front, F-15C, F-15E
  and more F-16s behind them, E-3 and KC-135 support at rear bases.
era: 2005
side: blue
groups:
  - base: airfield
    placement: front
    squadrons:
      - {aircraft: ["A-10C Thunderbolt II (Suite 3)", "A-10C Thunderbolt II (Suite 7)", "A-10A Thunderbolt II"], country: USA, primary: CAS, secondary: [BAI, Armed Recon], size: 12}
      - {aircraft: ["F-16CM Fighting Falcon (Block 50)"], country: USA, primary: SEAD, secondary: any, size: 12}
      - {aircraft: ["UH-60L", "UH-60A"], country: USA, primary: CSAR, secondary: [Transport], size: 4}
  - base: airfield
    placement: any
    squadrons:
      - {aircraft: ["F-15C Eagle"], country: USA, primary: BARCAP, secondary: air-to-air, size: 12}
      - {aircraft: ["F-15E Strike Eagle (Suite 4+)", "F-15E Strike Eagle"], country: USA, primary: Strike, secondary: any, size: 12}
      - {aircraft: ["F-16CM Fighting Falcon (Block 50)"], country: USA, primary: BAI, secondary: any, size: 12}
  - base: airfield
    placement: rear
    squadrons:
      - {aircraft: ["E-3A"], country: USA, primary: AEW&C, size: 2}
      - {aircraft: ["KC-130J", "C-130J-30", "C-130"], country: USA, primary: Rescue King, secondary: [Transport], size: 2}
      - {aircraft: ["KC-135 Stratotanker"], country: USA, primary: Refueling, size: 4}
      - {aircraft: ["KC-135 Stratotanker MPRS", "KC-10 Extender (Drogue)"], country: USA, primary: Refueling, size: 2}
  # T3: a bomber detachment, only where the campaign defines an off-map base
  # (in 2003 B-1Bs and B-52s flew from Diego Garcia, Fairford and Al Udeid).
  - base: off-map
    squadrons:
      - {aircraft: ["B-1B Lancer"], country: USA, primary: Strike, secondary: [BAI, OCA/Runway], size: 6, buy: 4}
      - {aircraft: ["B-52H Stratofortress"], country: USA, primary: Strike, secondary: [BAI, OCA/Runway], size: 6, buy: 4}
