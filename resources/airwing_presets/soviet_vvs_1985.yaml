# Air wing preset. See docs/resolution/Air-Wing-Presets.md for the format.
#
# No country is set, so squadrons use the faction's own country (USSR, Russia, a
# Warsaw Pact client, ...).
name: Soviet Frontal Aviation (1985)
description: >-
  Late Cold War Soviet air army: MiG-29 and MiG-23 fighters, Su-24 bombers, Su-25
  and Su-17 attack aircraft, MiG-31 interceptors, A-50 AEW, Il-78 tankers and
  Mi-24 / Mi-8 helicopters.
era: 1985
side: red
groups:
  - base: airfield
    placement: front
    squadrons:
      - {aircraft: ["Su-25 Frogfoot"], primary: CAS, secondary: [BAI, Armed Recon], size: 12}
      - {aircraft: ["Su-17M4 Fitter-K", "MiG-27K Flogger-J2"], primary: BAI, secondary: air-to-ground, size: 12}
      - {aircraft: ["Mi-24V Hind-E", "Mi-24P Hind-F"], primary: CAS, secondary: [BAI, Armed Recon], size: 8}
      - {aircraft: ["Mi-8MTV2 Hip", "Mi-17 Hip"], primary: Air Assault, secondary: [Transport], size: 6}
  - base: airfield
    placement: any
    squadrons:
      - {aircraft: ["MiG-29A Fulcrum-A", "MiG-29S Fulcrum-C"], primary: BARCAP, secondary: air-to-air, size: 12}
      - {aircraft: ["MiG-29A Fulcrum-A", "MiG-29S Fulcrum-C"], primary: Escort, secondary: air-to-air, size: 12}
      - {aircraft: ["MiG-23MLD Flogger-K", "MiG-23ML Flogger-G"], primary: BARCAP, secondary: air-to-air, size: 12}
      - {aircraft: ["Su-24M Fencer-D"], primary: Strike, secondary: air-to-ground, size: 12}
  - base: airfield
    placement: rear
    squadrons:
      - {aircraft: ["MiG-31 Foxhound", "MiG-25PD Foxbat-E"], primary: Intercept, secondary: air-to-air, size: 8}
      - {aircraft: ["A-50"], primary: AEW&C, size: 2}
      - {aircraft: ["IL-78M"], primary: Refueling, size: 2}
