# Soviet (Cold War Frontal Aviation and PVO) air campaign planning profile.
# Extends the Russian profile: the same air-operation structure, flown the
# Cold War way.
#
# Compared with the modern VKS:
# - The initial air operation is longer and larger. Front and Long Range
#   Aviation fly regiment-sized raids in several echelons: suppression first,
#   then fighters clearing the air, then the main strike group, then a
#   follow-up wave.
# - Strike groups ingress at low level under the radar, relying on mass and
#   terrain masking instead of stand-off weapons and jamming support.
# - Mostly unguided bombs and rockets. Guided weapons are TV and laser only.
# - No HVAA CAP: AWACS aircraft were few, and fighters belong to PVO or the front.
# - Higher acceptable losses; the war was expected to be short and decisive.
#
# Sources: FM 100-2-1 ch. 14 "Air operation"; Zaloga, Soviet Air Power;
# Warsaw Pact exercise plans (Seven Days to the River Rhine, 1979).

extends: russian_modern
name: soviet

period:
  # The initial air operation goes in early and massed.
  main_push_start_min: 90
  main_push_share: 0.6

sorties:
  mission_capable_rate: 0.65
  turnaround_hours:
    fighter: 2.5
    attack: 3.0
    bomber: 5.0
    support: 4.0
    helicopter: 2.0

risk:
  attrition_limit: 0.05
  absolute_limit: 0.18
  rollback_allowance:
    limit: 0.15

phases:
  merge: true
  list:
    initial_air_operation:
      description: "Initial air operation: regiment-sized echeloned raids at low level against airfields, nuclear delivery means, air defense and command posts."
      flags:
        raid_style: massed
        risk_multiplier: 1.3
      transitions:
        - to: pvo_defense
          min_turns: 1
          when:
            any:
              - {moe: own_air_losses, ge: 0.45}
              - {moe: air_superiority, le: 0.4, sustain: 2}
        # Planned for three days, longer only if the air battle is clearly
        # going the Pact's way.
        - to: front_offensive
          when:
            any:
              - all:
                  - {moe: air_superiority, ge: 1.3}
                  - {moe: enemy_air_attrition, ge: 0.25}
              - {moe: turns_in_phase, ge: 4}
    front_offensive:
      apportionment:
        dca:          {share: 0.15, min: 0.1, max: 0.25}
        support:      {share: 0.03, min: 0.0, max: 0.08}
        oca:          {share: 0.08, min: 0.0, max: 0.15}
        sead:         {share: 0.1, min: 0.05, max: 0.2}
        strike:       {share: 0.04, min: 0.0, max: 0.1}
        interdiction: {share: 0.22, min: 0.12, max: 0.35}
        cas:          {share: 0.38, min: 0.25, max: 0.55}

modifiers:
  force_preservation:
    description: "Preserving the air force: fighters under the SAM umbrella, offensive raids stopped."
    hold_turns: 2
    when:
      any:
        - {moe: own_air_losses, ge: 0.4}
        - {moe: air_superiority, le: 0.35, sustain: 2}
    effects:
      iads_preserve: true
      # GCI: no scrambles into raids more than this many times the alerts able to meet them.
      scramble_max_odds: 1.5
      alert_pairs_bonus: 1
      dca_forward_scale: 0.4
      cap_under_own_sam: true
      risk_scale: 0.6
      raid_style: none
      scale_categories: {oca: 0.3, strike: 0.3, sead: 0.6, interdiction: 0.8}

packages:
  sead_label: "ARM support (Kh-58/Kh-25MP)"
  max_package_size: 32
  max_strikers: 12

raids:
  max_per_period: 3
  min_strikers: 8
  ingress: low
  echelons:
    - {role: suppression, offset_min: -8}
    - {role: clearing, offset_min: -4}
    - {role: main, offset_min: 0}
    - {role: follow_up, offset_min: 10, optional: true}

weaponeering:
  weapons_per_aircraft: 4
  guidance_preference:
    clear_day:    [tv, laser, unguided]
    clear_night:  [unguided]
    under_cloud:  [unguided]

dca:
  hvaa_cap: false
  qra_per_base: 4

conditions:
  # Su-24 and MiG-27 bomb at night by radar and dead reckoning.
  night_requires_sensor: true

iads:
  emcon:
    # PVO mobile brigades (SA-6, SA-8, SA-11) fought from ambush.
    mobile: ambush
  moves:
    move_share: 0.35
  # Maskirovka: dummy launchers and radars at every battery.
  decoys:
    per_site: 2
