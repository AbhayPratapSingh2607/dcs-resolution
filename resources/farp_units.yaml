# Units used to dress player FARPs (see game/missiongenerator/farpunits.py).
#
# For each role, the first candidate the FARP owner's faction has is used.
# Candidates meant for the other scenery than the FARP site's (desert or
# woodland) are only used when nothing else fits. List mod units first.
# Mod units are only in a faction when that mod is enabled, so listing them
# here is safe.
#
#   type:    DCS unit type id
#   scenery: desert, woodland or any (default any)
#   livery:  optional livery id, used when the scenery matches
#
# Aircraft use the livery of a squadron of the same type in the coalition's air
# wing when there is one.

soldier:
  # CurrentHill USA asset pack
  - type: CH_USInfantry_M4
  - type: CH_USInfantry_M249
  # DCS
  - type: Soldier M4
    scenery: desert
  - type: Soldier M4 GRG
    scenery: woodland
  - type: Soldier M249
  - type: Infantry AK ver3
  - type: Infantry AK ver2
  - type: Infantry AK
  - type: Soldier AK
  - type: Paratrooper AKS-74
    scenery: woodland
  - type: Infantry AK Ins
    scenery: desert
  # WWII assets
  - type: soldier_wwii_us
  - type: soldier_wwii_br_01
  - type: soldier_mauser98

manpad:
  # CurrentHill USA asset pack
  - type: CH_USInfantry_FIM92
  # DCS
  - type: Soldier stinger
  - type: SA-18 Igla-S manpad
  - type: SA-18 Igla manpad
  - type: Igla manpad INS
    scenery: desert

# The Wet Wing's transport plane.
transport_plane:
  - type: C-130J-30
  - type: Hercules
  - type: C-130
  - type: IL-76MD
  - type: C-17A
  - type: An-26B
  - type: An-30M

# The Fat Cow's transport helicopter.
fatcow_helicopter:
  - type: CH-47Fbl1
  - type: CH-47D
  - type: Mi-26
  - type: Mi-8MT
  - type: UH-60A
